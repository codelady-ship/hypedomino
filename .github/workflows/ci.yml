name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.areas.outputs.server }}
      admin: ${{ steps.areas.outputs.admin }}
      client: ${{ steps.areas.outputs.client }}
      proto: ${{ steps.areas.outputs.proto }}
      proto_breaking: ${{ steps.areas.outputs.proto_breaking }}
      deploy: ${{ steps.areas.outputs.deploy }}
      backup: ${{ steps.areas.outputs.backup }}
      assets: ${{ steps.areas.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'docs/cosmetics/schema.json'
              - 'tools/asset-export/budgets.json'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'server/internal/cosmetics/builtin.json'
              - 'docs/cosmetics/examples/**'
              - '.github/workflows/ci.yml'
            assets:
              - 'assets-src/**'
              - 'tools/asset-export/**'
              - 'tools/asset-naming/**'
              - 'tools/cosmetics-schema/**'
              - '.github/workflows/ci.yml'
            deploy:
              - 'server/**'
              - 'deploy/**'
              - 'tools/deploy/**'
              - '.github/workflows/ci.yml'
            backup:
              - 'tools/backup-drill/**'
              - 'deploy/k8s/backup/**'
              - 'deploy/k8s/postgres/**'
              - 'server/Dockerfile'
              - 'server/go.mod'
              - 'server/cmd/account-deletion/**'
              - 'server/cmd/migrate/**'
              - 'server/internal/account/**'
              - 'server/internal/db/**'
              - 'server/internal/deletionlog/**'
              - 'server/internal/objectstore/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'server/internal/pb/**'
              - 'client/Assets/HypeDomino/Generated/**'
              - 'admin/src/gen/**'
              - 'tools/proto-lint/**'
              - '.github/workflows/ci.yml'
      - id: areas
        env:
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
          CLIENT_CHANGED: ${{ steps.filter.outputs.client }}
          PROTO_CHANGED: ${{ steps.filter.outputs.proto }}
          DEPLOY_CHANGED: ${{ steps.filter.outputs.deploy }}
          BACKUP_CHANGED: ${{ steps.filter.outputs.backup }}
          ASSETS_CHANGED: ${{ steps.filter.outputs.assets }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          emit() {
            if [ "$2" = "true" ] && [ -f "$3" ]; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"
          }
          emit server "$SERVER_CHANGED" server/go.mod
          emit admin "$ADMIN_CHANGED" admin/package.json
          emit client "$CLIENT_CHANGED" client/ProjectSettings/ProjectVersion.txt
          emit proto "$PROTO_CHANGED" proto/buf.yaml
          emit deploy "$DEPLOY_CHANGED" server/Dockerfile
          emit backup "$BACKUP_CHANGED" tools/backup-drill/drill.sh
          emit assets "$ASSETS_CHANGED" tools/asset-export/asset-export.mjs
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:proto/buf.yaml" 2>/dev/null; then
            echo "proto_breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto_breaking=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run lint
      - run: npm run test:tools

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="${merge_base}..${HEAD_SHA}" .
      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  pr-meta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=""
          for prefix in "type:" "area:" "priority:"; do
            echo "$LABELS" | jq -e --arg p "$prefix" 'any(.[]; startswith($p))' >/dev/null || missing="$missing $prefix"
          done
          if [ -n "$missing" ]; then
            echo "Missing labels:$missing"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|part of) #[0-9]+'; then
            echo "PR body must link its issue with 'Closes #N' or 'Part of #N'"
            exit 1
          fi
          echo "Labels and issue link present"

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Rules coverage floor
        run: |
          rules=$(go tool cover -func=coverage.out | awk '$1 ~ /internal\/rules\// {total += 1} END {print total}')
          percent=$(go test -cover ./internal/rules/ | grep -o 'coverage: [0-9.]*' | grep -o '[0-9.]*')
          echo "server/internal/rules coverage: ${percent}% (${rules} functions)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v p="$percent" 'BEGIN { exit (p + 0 >= 95) ? 0 : 1 }' || { echo "rules coverage ${percent}% is below the 95% floor of docs/test-strategy.md section 11"; exit 1; }
      - name: Admin API has no known reachable vulnerability
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/admin-api/...

  bench:
    needs: changes
    if: needs.changes.outputs.server == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Benchmark this branch
        run: go test -run='^$' -bench=. -benchmem -count=6 ./internal/rules/ | tee new.txt
      - name: Benchmark main
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -d ../base/server/internal/rules ]; then
            (cd ../base/server && go test -run='^$' -bench=. -benchmem -count=6 ./internal/rules/) | tee old.txt
          else
            echo "no rules package on the base" | tee old.txt
          fi
      - name: benchstat against main
        run: |
          go run golang.org/x/perf/cmd/benchstat@latest old.txt new.txt | tee benchstat.txt || true
          { echo '## Benchmarks against main (report only)'; echo '```'; cat benchstat.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform and kind
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          curl -sSfL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Server manifests render and match the Kubernetes schema
        run: |
          for dir in deploy/k8s/base deploy/k8s/overlays/ci deploy/k8s/monitoring; do
            kubectl kustomize "$dir" | kubeconform -strict -summary -
          done
          kubeconform -strict -summary tools/deploy/ci-postgres.yaml
      - name: Alert rules load and fire as their tests expect
        run: |
          docker run --rm -v "$PWD/deploy/k8s/monitoring:/rules:ro" -w /rules --entrypoint promtool "$PROMETHEUS_IMAGE" check rules server-latency.rules.yaml
          docker run --rm -v "$PWD/deploy/k8s/monitoring:/rules:ro" -w /rules --entrypoint promtool "$PROMETHEUS_IMAGE" test rules server-latency.rules.test.yaml
      - name: Build the server image
        run: docker build -t hypedomino-server:ci server
      - name: Image size
        run: docker image inspect -f 'hypedomino-server:ci {{.Size}} bytes' hypedomino-server:ci | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container health, bad config exit and SIGTERM drain
        run: bash tools/deploy/container-smoke.sh hypedomino-server:ci
      - name: Create the cluster
        run: kind create cluster --name hd --wait 120s
      - name: Migration job before the rollout, rolling deploy drains old pods, rollback under 5 minutes
        run: bash tools/deploy/kind-rollout.sh hd hypedomino-server:ci
      - name: Debug port scraped from the monitoring namespace only
        run: bash tools/deploy/kind-metrics.sh hd-ci

  backup-drill:
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform and kind
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          curl -sSfL -o "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Backup and PostgreSQL manifests render and match the Kubernetes schema
        run: |
          for dir in deploy/k8s/backup deploy/k8s/postgres; do
            kubectl kustomize "$dir" | kubeconform -strict -summary -
          done
      - name: Manifests use the image tag the Dockerfile publishes
        run: |
          expected="ghcr.io/alievs-corp/hypedomino-postgres-walg:$(bash tools/backup-drill/image-tag.sh)"
          for dir in deploy/k8s/backup deploy/k8s/postgres; do
            found=$(kubectl kustomize "$dir" | sed -nE 's/^ *image: (.*hypedomino-postgres-walg.*)$/\1/p' | sort -u)
            [ "$found" = "$expected" ] || { echo "$dir uses '$found', the publish workflow pushes $expected"; exit 1; }
          done
      - name: Restore to a point in time from WAL-G backups
        run: bash tools/backup-drill/drill.sh
      - name: Create the cluster
        run: kind create cluster --name hd --wait 120s
      - name: PostgreSQL StatefulSet archives WAL and the backup CronJobs run against it
        run: bash tools/backup-drill/kind-postgres.sh hd

  admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - run: pnpm run build
      - name: No critical vulnerability in admin dependencies
        run: pnpm audit --audit-level=critical

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: unity-library-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: unity-library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: all
          githubToken: ''

  assets:
    needs: changes
    if: needs.changes.outputs.assets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Naming of assets-src
        run: node tools/asset-naming/asset-naming.mjs
      - name: Export and size budget of new and changed items
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- assets-src)
          else
            changed=$(git ls-files assets-src)
          fi
          mapfile -t items < <(printf '%s\n' "$changed" | node tools/asset-export/asset-export.mjs items)
          if [ "${#items[@]}" -eq 0 ]; then
            echo "No cosmetic item with an export changed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          include=$(printf '%s/export/**,' "${items[@]}")
          git lfs install --local
          git lfs pull --include="${include%,}"
          { echo '## Asset size budget'; echo; } >> "$GITHUB_STEP_SUMMARY"
          node tools/asset-export/asset-export.mjs check "${items[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint proto
      - run: buf format --diff --exit-code proto
      - if: github.event_name == 'pull_request' && needs.changes.outputs.proto_breaking == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: buf breaking proto --against ".git#ref=${BASE_SHA},subdir=proto"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/proto-lint/proto-lint.mjs proto
      - run: buf generate proto --template proto/buf.gen.yaml
      - name: generated code is current
        run: |
          drift=$(git status --porcelain -- server/internal/pb client/Assets/HypeDomino/Generated admin/src/gen)
          [ -z "$drift" ] || { echo "$drift"; echo "generated code differs from proto/, run npm run proto:gen and commit"; exit 1; }

  ci-complete:
    name: CI complete
    if: always()
    needs: [changes, lint, secret-scan, pr-meta, server, image, backup-drill, admin, client, assets, proto]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_ok=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          must_run=$(echo "$RESULTS" | jq -r '[.changes.result, .lint.result, .["secret-scan"].result] | map(select(. != "success")) | length')
          if [ -n "$not_ok" ] || [ "$must_run" != "0" ]; then
            echo "Failed or cancelled: ${not_ok:-changes/lint/secret-scan did not succeed}"
            exit 1
          fi
