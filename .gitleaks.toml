# Default gitleaks rules plus one narrow allowlist. The store purchase tests use
# made-up UUIDs as App Store / Play account tokens; generic-api-key flags them.
# Only a UUID assigned to an AccountToken field inside a purchase test file is
# skipped, so real keys anywhere else still fail the scan.
title = "hypedomino gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Fake store account token UUIDs in purchase test fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^server/internal/purchase/[^/]+_test\.go$''']
regexTarget = "match"
regexes = ['''(?i)accounttoken"?\s*[:=]\s*"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"''']
